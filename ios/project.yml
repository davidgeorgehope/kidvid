name: KidVid
options:
  bundleIdPrefix: com.kidvid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
targets:
  KidVid:
    type: application
    platform: iOS
    sources:
      - path: KidVid
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kidvid.ios
        INFOPLIST_FILE: KidVid/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
